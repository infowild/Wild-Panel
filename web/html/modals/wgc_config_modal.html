{{define "modals/wgcConfigModal"}}
<a-modal id="wgc-config-modal" v-model="wgcConfigModal.visible"
  :closable="true" :mask-closable="true" :class="themeSwitcher.currentTheme" :footer="null" :width="640">
  <template slot="title">
    <div class="wca-head">
      <div class="wca-head__id">
        <span class="wca-head__title">WireGuard Config</span>
        <span class="wca-head__sub">[[ wgcConfigModal.email ]]</span>
      </div>
      <div class="wca-head__aside">
        <span class="wca-badge wca-badge--accent">wireguard</span>
      </div>
    </div>
  </template>
  <a-spin :spinning="wgcConfigModal.loading">
    <div class="wca">
      <div class="wca-empty" v-if="!wgcConfigModal.loading && wgcConfigModal.devices.length === 0">
        No WireGuard configuration is available for this account yet.
      </div>
      <div v-for="(dev, index) in wgcConfigModal.devices" :key="index" class="wca-card">
        <div class="wca-card__qr">
          <div class="wca-qr wca-qr--sm">
            <canvas :id="'wgcQr-' + index" class="qr-cv" @click="copy(dev.config)"></canvas>
          </div>
        </div>
        <div class="wca-card__info">
          <div class="wca-card__head">
            <span class="wca-badge wca-badge--ok">[[ dev.ip ]]</span>
            <span class="wca-badge wca-badge--label" v-if="dev.remark">[[ dev.remark ]]</span>
          </div>
          <div class="wca-copyrow">
            <span class="wca-copyrow__label">Tunnel profile</span>
            <div class="wca-copyrow__field">
              <code class="wca-code wca-code--block">[[ dev.config ]]</code>
              <button type="button" class="wca-copy wca-copy--primary" title='{{ i18n "copy" }}'
                @click="copy(dev.config)">
                <a-icon type="copy"></a-icon>
              </button>
            </div>
            <div class="wca-acts">
              <button type="button" class="wca-act" @click="download(dev)">
                <a-icon type="download"></a-icon>
                <span>{{ i18n "download" }}</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      {{ template "component/aSubBlock" "wgc" }}
    </div>
  </a-spin>
</a-modal>

<script>
  const wgcConfigModal = {
    visible: false,
    loading: false,
    title: 'WireGuard Config',
    dbInboundId: 0,
    email: '',
    // Declared here, not assigned only in show(): Vue makes the properties of this
    // object reactive when the instance below is created, so a key added later would
    // never drive the subscription block's v-if.
    subId: '',
    devices: [],
    show: function (dbInboundId, client) {
      this.dbInboundId = dbInboundId;
      this.email = client && client.email ? client.email : '';
      this.subId = client && client.subId ? client.subId : '';
      this.title = 'WireGuard Config' + (this.email ? ' - ' + this.email : '');
      this.devices = [];
      this.loading = true;
      this.visible = true;
      wgcConfigModalApp.fetchConfigs();
    },
    close: function () {
      this.visible = false;
    },
  };

  const wgcConfigModalApp = new Vue({
    delimiters: ['[[', ']]'],
    el: '#wgc-config-modal',
    data: {
      wgcConfigModal: wgcConfigModal,
    },
    computed: {
      // What component/aSubBlock reads. Empty unless the sub server is on and the
      // account has a subId, which is also what hides the block.
      //
      // The account's subId is read FIRST and unconditionally: a computed only re-runs
      // when a dependency it actually touched changes, so guarding on app.subSettings
      // ahead of it short-circuited before Vue ever recorded subId as a dependency, and
      // the cached '' from page load was never invalidated when a modal opened. The
      // settings arrive from an API call, so at that first evaluation they are not there
      // yet and the guard was always false.
      subId() {
        const subId = wgcConfigModal.subId;
        const subEnabled = !!(typeof app !== 'undefined' && app.subSettings && app.subSettings.enable);
        return subEnabled ? subId : '';
      },
      subLink() {
        return this.subId ? app.subSettings.subURI + this.subId : '';
      },
      subJsonLink() {
        return this.subId && app.subSettings.subJsonEnable
          ? app.subSettings.subJsonURI + this.subId : '';
      },
    },
    methods: {
      async fetchConfigs() {
        try {
          // Respect the global axios baseURL: do NOT prefix with base_path here.
          const msg = await HttpUtil.get(
            '/panel/api/inbounds/' + wgcConfigModal.dbInboundId + '/wgc-configs',
            { email: wgcConfigModal.email }
          );
          wgcConfigModal.devices = (msg && msg.success && Array.isArray(msg.obj)) ? msg.obj : [];
        } catch (e) {
          console.error('Failed to load WireGuard configs:', e);
          wgcConfigModal.devices = [];
        } finally {
          wgcConfigModal.loading = false;
        }
      },
      copy(content) {
        ClipboardManager.copyText(content).then(() => {
          app.$message.success('{{ i18n "copied" }}');
        });
      },
      download(dev) {
        const base = wgcConfigModal.email || 'client';
        const suffix = dev.remark ? '-' + String(dev.remark).replace(/[^A-Za-z0-9_.-]/g, '_') : '';
        FileManager.downloadTextFile(dev.config, base + suffix + '.conf', { type: 'text/plain;charset=utf-8' });
      },
      // a-modal portals its body to the document root, so these are looked up on the
      // document rather than through this.$el.
      qr(selector, value) {
        const el = document.querySelector(selector);
        if (!el) return;
        const plate = el.closest('.wca-card__qr');
        if (!value) {
          if (plate) plate.style.display = 'none';
          return;
        }
        try {
          new QRious({
            element: el,
            size: 360,
            value: value,
            background: 'white',
            backgroundAlpha: 1,
            foreground: 'black',
            padding: 8,
            level: 'L',
          });
          if (plate) plate.style.display = '';
        } catch (e) {
          if (plate) plate.style.display = 'none';
        }
      },
      renderQrs() {
        wgcConfigModal.devices.forEach((dev, index) => {
          this.qr('#wgcQr-' + index, dev.config);
        });
        this.qr('#wgc-sub-qr', this.subLink);
        this.qr('#wgc-subjson-qr', this.subJsonLink);
      },
    },
    updated() {
      if (this.wgcConfigModal.visible && !this.wgcConfigModal.loading) {
        this.$nextTick(() => this.renderQrs());
      }
    },
  });
</script>
{{end}}
