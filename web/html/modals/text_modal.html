{{define "modals/textModal"}}
<a-modal id="text-modal" v-model="txtModal.visible" :closable="true"
    :class="themeSwitcher.currentTheme">
    <template slot="title">
        <div class="wca-head">
            <div class="wca-head__id">
                <span class="wca-head__title">[[ txtModal.title ]]</span>
                <span class="wca-head__sub" v-if="!ObjectUtil.isEmpty(txtModal.fileName)">[[ txtModal.fileName
                    ]]</span>
            </div>
        </div>
    </template>
    <div class="wca">
        <section class="wca-sec">
            <div class="wca-sec__body">
                <a-input :style="{ overflowY: 'auto' }" type="textarea" v-model="txtModal.content"
                    :autosize="{ minRows: 10, maxRows: 20}"></a-input>
            </div>
        </section>
    </div>
    <template slot="footer">
        <a-button v-if="!ObjectUtil.isEmpty(txtModal.fileName)" icon="download"
            @click="FileManager.downloadTextFile(txtModal.content, txtModal.fileName)">
            <span>[[ txtModal.fileName ]]</span>
        </a-button>
        <a-button type="primary" icon="copy" @click="txtModal.copy(txtModal.content)">
            <span>{{ i18n "copy" }}</span>
        </a-button>
    </template>
</a-modal>

<script>
    const txtModal = {
        title: '',
        content: '',
        fileName: '',
        qrcode: null,
        visible: false,
        show: function (title = '', content = '', fileName = '') {
            this.title = title;
            this.content = content;
            this.fileName = fileName;
            this.visible = true;
        },
        copy: function (content = '') {
            ClipboardManager
                .copyText(content)
                .then(() => {
                    app.$message.success('{{ i18n "copied" }}')
                    this.close();
                })
        },
        close: function () {
            this.visible = false;
        },
    };

    const textModalApp = new Vue({
        delimiters: ['[[', ']]'],
        el: '#text-modal',
        data: {
            txtModal: txtModal,
        },
    });
</script>
{{end}}
