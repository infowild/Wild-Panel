{{define "modals/qrcodeModal"}}
<a-modal id="qrcode-modal" v-model="qrModal.visible" :closable="true" :class="themeSwitcher.currentTheme"
  width="fit-content" :dialog-style="isMobile ? { top: '18px' } : {}" :footer="null">
  <template #title>
    <div class="wca-head">
      <div class="wca-head__id">
        <span class="wca-head__title">[[ qrModal.title ]]</span>
        <span class="wca-head__sub">[[ qrModal.client && qrModal.client.email ? qrModal.client.email + ' · ' +
          qrModal.dbInbound.remark : qrModal.dbInbound.remark ]]</span>
      </div>
      <div class="wca-head__aside">
        <span class="wca-badge wca-badge--accent" v-if="qrModal.dbInbound.protocol">[[ qrModal.dbInbound.protocol
          ]]</span>
      </div>
    </div>
  </template>
  <tr-qr-modal class="wca">
    <template v-if="app.subSettings?.enable && qrModal.subId">
      <tr-qr-box class="wca-card">
        <div class="wca-card__qr">
          <div class="wca-qr">
            <canvas @click="copy(genSubLink(qrModal.client.subId))" id="qrCode-sub" class="qr-cv"></canvas>
          </div>
        </div>
        <div class="wca-card__info">
          <div class="wca-card__head">
            <span class="wca-badge wca-badge--info">{{ i18n "pages.settings.subSettings"}}</span>
          </div>
          <div class="wca-copyrow">
            <span class="wca-copyrow__label">Subscription link</span>
            <div class="wca-copyrow__field">
              <code class="wca-code">[[ genSubLink(qrModal.client.subId) ]]</code>
              <button type="button" class="wca-copy wca-copy--primary" title='{{ i18n "copy" }}'
                @click="copy(genSubLink(qrModal.client.subId))">
                <a-icon type="copy"></a-icon>
              </button>
            </div>
          </div>
        </div>
      </tr-qr-box>
      <tr-qr-box class="wca-card" v-if="app.subSettings.subJsonEnable">
        <div class="wca-card__qr">
          <div class="wca-qr">
            <canvas @click="copy(genSubJsonLink(qrModal.client.subId))" id="qrCode-subJson" class="qr-cv"></canvas>
          </div>
        </div>
        <div class="wca-card__info">
          <div class="wca-card__head">
            <span class="wca-badge wca-badge--info">{{ i18n "pages.settings.subSettings"}} Json</span>
          </div>
          <div class="wca-copyrow">
            <span class="wca-copyrow__label">Json link</span>
            <div class="wca-copyrow__field">
              <code class="wca-code">[[ genSubJsonLink(qrModal.client.subId) ]]</code>
              <button type="button" class="wca-copy wca-copy--primary" title='{{ i18n "copy" }}'
                @click="copy(genSubJsonLink(qrModal.client.subId))">
                <a-icon type="copy"></a-icon>
              </button>
            </div>
          </div>
        </div>
      </tr-qr-box>
    </template>
    <template v-for="(row, index) in qrModal.qrcodes">
      <tr-qr-box class="wca-card">
        <div class="wca-card__qr" v-show="row.qrOk !== false">
          <div class="wca-qr">
            <canvas @click="copy(row.link)" :id="'qrCode-'+index" class="qr-cv"></canvas>
          </div>
          <div class="wca-qr-meta">
            <span class="wca-qr-meta__hint">[[ qrModal.dbInbound.address ]]:[[ qrModal.dbInbound.port ]]</span>
          </div>
        </div>
        <div class="wca-card__info">
          <div class="wca-card__head">
            <div class="wca-qr-meta__name qr-tag"><span>[[ row.remark ]]</span></div>
          </div>
          <div class="wca-copyrow">
            <span class="wca-copyrow__label">[[ isShareUri(row.link) ? 'Connection link' : 'Tunnel profile' ]]</span>
            <div class="wca-copyrow__field">
              <code class="wca-code" :class="{ 'wca-code--block': !isShareUri(row.link) }">[[ row.link ]]</code>
              <button type="button" class="wca-copy wca-copy--primary" title='{{ i18n "copy" }}'
                @click="copy(row.link)">
                <a-icon type="copy"></a-icon>
              </button>
            </div>
            <div class="wca-acts" v-if="!isShareUri(row.link)">
              <button type="button" class="wca-act" @click="downloadProfile(row)">
                <a-icon type="download"></a-icon>
                <span>{{ i18n "download" }}</span>
              </button>
            </div>
          </div>
          <div class="wca-hosts__row" v-if="isShareUri(row.link)">
            <span class="wca-hosts__name">{{ i18n "useIPv4ForHost" }}</span>
            <a-switch size="small" :checked="row.useIPv4" @click="toggleIPv4(index)"></a-switch>
          </div>
        </div>
      </tr-qr-box>
    </template>
  </tr-qr-modal>
</a-modal>

<style>
  .ant-table:not(.ant-table-expanded-row .ant-table) {
    outline: 1px solid #f0f0f0;
    outline-offset: -1px;
    border-radius: 1rem;
    overflow-x: hidden;
  }

  /* The canvas is redrawn by QRious on every host toggle, so nothing here may
     animate the code itself: opacity, blur and fractional scale all cost
     scan reliability on a phone camera. The acknowledgement is drawn on the
     plate's border instead, which is outside the quiet zone. */
  #qrcode-modal .wca-qr:has(.qr-flash) {
    animation: qr-flash-animation 0.6s ease-in-out;
  }

  @keyframes qr-flash-animation {
    0% {
      border-color: var(--border);
    }

    35% {
      border-color: var(--accent);
    }

    100% {
      border-color: var(--border);
    }
  }
</style>

<script>
  const qrModal = {
    title: '',
    dbInbound: new DBInbound(),
    client: null,
    qrcodes: [],
    visible: false,
    subId: '',
    show: function (title = '', dbInbound, client) {
      this.title = title;
      this.dbInbound = dbInbound;
      this.inbound = dbInbound.toInbound();
      this.client = client;
      this.subId = '';
      this.qrcodes = [];
      // Reset the status fetched flag when showing the modal
      if (qrModalApp) qrModalApp.statusFetched = false;
      if (this.inbound.protocol == Protocols.WIREGUARD) {
        this.inbound.genInboundLinks(dbInbound.remark).split('\r\n').forEach((l, index) => {
          this.qrcodes.push({
            remark: "Peer " + (index + 1),
            link: l,
            useIPv4: false,
            originalLink: l
          });
        });
      } else {
        this.inbound.genAllLinks(this.dbInbound.remark, app.remarkModel, client).forEach(l => {
          // genLink returns '' for the protocols that have no raw share-link (the
          // credential VPNs, wg-c/awg, ssh). They open this modal for their
          // subscription QR alone, so drop the empty entry rather than drawing a
          // blank QR under a green remark tag.
          if (!l.link) return;
          this.qrcodes.push({
            remark: l.remark,
            link: l.link,
            useIPv4: false,
            originalLink: l.link
          });
        });
      }
      this.visible = true;
    },
    close: function () {
      this.visible = false;
    },
  };
  const qrModalApp = new Vue({
    delimiters: ['[[', ']]'],
    el: '#qrcode-modal',
    mixins: [MediaQueryMixin],
    data: {
      qrModal: qrModal,
      serverStatus: null,
      statusFetched: false,
    },
    methods: {
      async getStatus() {
        try {
          const msg = await HttpUtil.get('/panel/api/server/status');
          if (msg.success) {
            this.serverStatus = msg.obj;
          }
        } catch (e) {
          console.error("Failed to get status:", e);
        }
      },
      
      isShareUri(content) {
        return typeof content === 'string' && /^[a-z][a-z0-9+.-]*:\/\//i.test(content.trim());
      },
      downloadProfile(row) {
        const base = (qrModal.client && qrModal.client.email) || qrModal.dbInbound.remark || 'client';
        const safe = String(row.remark || base).replace(/[^A-Za-z0-9_.-]/g, '_');
        FileManager.downloadTextFile(row.link, safe + '.conf', { type: 'text/plain;charset=utf-8' });
      },
      toggleIPv4(index) {
        const row = qrModal.qrcodes[index];
        row.useIPv4 = !row.useIPv4;
        this.updateLink(index);
      },
      updateLink(index) {
        const row = qrModal.qrcodes[index];
        if (!this.serverStatus || !this.serverStatus.publicIP) {
          return;
        }
        
        if (row.useIPv4 && this.serverStatus.publicIP.ipv4) {
          const originalLink = row.originalLink;
          const ipv4 = this.serverStatus.publicIP.ipv4;

          if (qrModal.inbound.protocol == Protocols.WIREGUARD || !this.isShareUri(originalLink)) {
            const endpointRegex = /Endpoint = ([^:]+):(\d+)/;
            const match = originalLink.match(endpointRegex);
            if (match) {
              row.link = originalLink.replace(
                `Endpoint = ${match[1]}:${match[2]}`,
                `Endpoint = ${ipv4}:${match[2]}`
              );
            }
          } else {
            try {
              const url = new URL(originalLink);
              url.hostname = ipv4;
              row.link = url.toString();
            } catch (e) {
              row.link = originalLink;
            }
          }
        } else {
          // Restore original link
          row.link = row.originalLink;
        }
        
        // Update QR code with transition effect
        const canvasElement = document.querySelector('#qrCode-' + index);
        if (canvasElement) {
          // Add flash animation class
          canvasElement.classList.add('qr-flash');
          
          // Remove the class after animation completes
          setTimeout(() => {
            canvasElement.classList.remove('qr-flash');
          }, 600);
        }
        
        const ok = this.isShareUri(row.link) ? this.setQrCode("qrCode-" + index, row.link) : false;
        if (row.qrOk !== ok) {
          this.$set(row, 'qrOk', ok);
        }
      },
      copy(content) {
        ClipboardManager
          .copyText(content)
          .then(() => {
            app.$message.success('{{ i18n "copied" }}')
          })
      },
      setQrCode(elementId, content) {
        const el = document.querySelector('#' + elementId);
        if (!el || !content) return false;
        try {
          new QRious({
            element: el,
            size: 400,
            value: content,
            background: 'white',
            backgroundAlpha: 0,
            foreground: 'black',
            padding: 2,
            level: 'L'
          });
          return true;
        } catch (e) {
          console.warn('QR generation failed', e);
          return false;
        }
      },
      genSubLink(subID) {
        return app.subSettings.subURI + subID;
      },
      genSubJsonLink(subID) {
        return app.subSettings.subJsonURI + subID;
      },
      revertOverflow() {
        const elements = document.querySelectorAll(".qr-tag");
        elements.forEach((element) => {
          element.classList.remove("tr-marquee");
          element.children[0].style.animation = '';
          while (element.children.length > 1) {
            element.removeChild(element.lastChild);
          }
        });
      }
    },
    updated() {
      if (this.qrModal.visible) {
        fixOverflow();
        if (!this.statusFetched) {
          this.getStatus();
          this.statusFetched = true;
        }
      } else {
        this.revertOverflow();
        // Reset the flag when modal is closed so it will fetch again next time
        this.statusFetched = false;
      }
      if (qrModal.client && qrModal.client.subId) {
        qrModal.subId = qrModal.client.subId;
        this.setQrCode("qrCode-sub", this.genSubLink(qrModal.subId));
        if (app.subSettings.subJsonEnable) {
          this.setQrCode("qrCode-subJson", this.genSubJsonLink(qrModal.subId));
        }
      }
      qrModal.qrcodes.forEach((element, index) => {
        const isShare = this.isShareUri(element.link);
        const ok = isShare ? this.setQrCode("qrCode-" + index, element.link) : false;
        if (element.qrOk !== ok) {
          this.$set(element, 'qrOk', ok);
        }
        // Update links based on current toggle state
        if (element.useIPv4 && this.serverStatus && this.serverStatus.publicIP) {
          this.updateLink(index);
        }
      });
    }
  });

  function fixOverflow() {
    const elements = document.querySelectorAll(".qr-tag");
    elements.forEach((element) => {
      function isElementOverflowing(element) {
        const overflowX = element.offsetWidth < element.scrollWidth,
          overflowY = element.offsetHeight < element.scrollHeight;
        return overflowX || overflowY;
      }

      function wrapContentsInMarquee(element) {
        element.classList.add("tr-marquee");
        element.children[0].style.animation = `move-ltr ${(element.children[0].clientWidth / element.clientWidth) * 5
          }s ease-in-out infinite`;
        const marqueeText = element.children[0];
        if (element.children.length < 2) {
          for (let i = 0; i < 1; i++) {
            const marqueeText = element.children[0].cloneNode(true);
            element.children[0].after(marqueeText);
          }
        }
      }
      if (isElementOverflowing(element)) {
        wrapContentsInMarquee(element);
      }
    });
  }
</script>
{{end}}
