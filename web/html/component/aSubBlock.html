{{define "component/aSubBlock"}}
<!-- Subscription QR + link, for the per-protocol config modals (WireGuard (C),
     AmneziaWG, SSH). Those modals own the QR icon on their client row, so without this
     block their accounts were the only ones whose QR icon did not lead to the
     subscription, unlike every Xray protocol.

     The dot is a per-modal id prefix: a-modal portals its body to the document root, so
     `this.$el.querySelector` cannot reach these canvases and the ids have to be unique
     across modals (the same reason the existing config QRs use document-level ids).

     Expects the including Vue instance to expose: subId, subLink, subJsonLink (all
     computed, empty when the sub server is off or the account has no subId) and copy(). -->
<template v-if="subId">
  <div class="wca-card">
    <div class="wca-card__qr">
      <div class="wca-qr wca-qr--sm">
        <canvas id="{{ . }}-sub-qr" class="qr-cv" @click="copy(subLink)"></canvas>
      </div>
    </div>
    <div class="wca-card__info">
      <div class="wca-card__head">
        <span class="wca-badge wca-badge--info">{{ i18n "pages.settings.subSettings" }}</span>
      </div>
      <div class="wca-copyrow">
        <span class="wca-copyrow__label">Subscription link</span>
        <div class="wca-copyrow__field">
          <code class="wca-code">[[ subLink ]]</code>
          <button type="button" class="wca-copy wca-copy--primary" title='{{ i18n "copy" }}' @click="copy(subLink)">
            <a-icon type="copy"></a-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="wca-card" v-if="subJsonLink">
    <div class="wca-card__qr">
      <div class="wca-qr wca-qr--sm">
        <canvas id="{{ . }}-subjson-qr" class="qr-cv" @click="copy(subJsonLink)"></canvas>
      </div>
    </div>
    <div class="wca-card__info">
      <div class="wca-card__head">
        <span class="wca-badge wca-badge--info">{{ i18n "pages.settings.subSettings" }} Json</span>
      </div>
      <div class="wca-copyrow">
        <span class="wca-copyrow__label">Json link</span>
        <div class="wca-copyrow__field">
          <code class="wca-code">[[ subJsonLink ]]</code>
          <button type="button" class="wca-copy" title='{{ i18n "copy" }}' @click="copy(subJsonLink)">
            <a-icon type="copy"></a-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
</template>
{{end}}
