{{define "component/sidebar/content"}}
<template>
    <!-- Three layers, one job each.
         Slot  = the page's footprint (collapsed, or pinned-open). Never peeks.
         Hit   = the hover region. Snaps to full width with no transition, so
                 the pointer cannot race the animation and fall onto the page.
         Rail  = the painted panel. This is what eases open.
         Peek is pure CSS (:hover / :focus-within). Vue only owns the persisted
         pin and the overlay latch that keeps the rail open while a portal
         popover (theme menu) is visible outside the hit region. -->
    <div class="bo-rail-slot"
        :class="{ 'is-pinned': pinned, 'is-overlay': overlayOpen }">
        <div class="bo-rail-hit">
            <nav class="bo-rail" aria-label='{{ i18n "menu.navigation"}}'>
                <div class="bo-rail-brand">
                    <a class="bo-rail-brand-link" href="{{ .base_path }}panel/" aria-label="Wild Panel">
                        <span class="wp-mark">
                            <span class="wp-mark__inner">
                                <img src="{{ .base_path }}assets/img/logo.png?{{ .cur_ver }}" width="56" height="56" alt="Wild Panel" />
                            </span>
                        </span>
                    </a>
                    <span class="wp-wordmark bo-rail-reveal">Wild Panel</span>
                </div>

                <div class="bo-rail-nav">
                    <a v-for="tab in tabs" :key="tab.key" class="bo-rail-item"
                        :class="{ 'is-active': isActive(tab.key) }" :href="tab.key"
                        :aria-current="isActive(tab.key) ? 'page' : false"
                        :title="pinned ? false : tab.title"
                        @click.prevent="openLink(tab.key)">
                        <span class="bo-rail-item-ico"><a-icon :type="tab.icon"></a-icon></span>
                        <span class="bo-rail-item-label bo-rail-reveal" v-text="tab.title"></span>
                    </a>
                </div>

                <div class="bo-rail-foot">
                    <a class="bo-rail-item bo-rail-item--logout" :href="logout.key"
                        :title="pinned ? false : logout.title"
                        @click.prevent="openLink(logout.key)">
                        <span class="bo-rail-item-ico"><a-icon :type="logout.icon"></a-icon></span>
                        <span class="bo-rail-item-label bo-rail-reveal" v-text="logout.title"></span>
                    </a>
                    <a-theme-switch
                        :show-label="true"
                        :label="themeLabel"
                        @overlay-change="onOverlayChange">
                    </a-theme-switch>
                    <button type="button" class="bo-rail-item bo-rail-pin" @click="togglePin"
                        :aria-pressed="pinned ? 'true' : 'false'"
                        :aria-label="pinned ? collapseLabel : expandLabel"
                        :title="pinned ? collapseLabel : expandLabel">
                        <span class="bo-rail-item-ico">
                            <a-icon :type="pinned ? 'menu-fold' : 'menu-unfold'"></a-icon>
                        </span>
                        <span class="bo-rail-item-label bo-rail-reveal"
                            v-text="pinned ? collapseLabel : expandLabel"></span>
                    </button>
                </div>
            </nav>
        </div>
    </div>
</template>
{{end}}

{{define "component/aSidebar"}}
<script>
    const SIDEBAR_COLLAPSED_KEY = "isSidebarCollapsed"

    Vue.component('a-sidebar', {
        data() {
            return {
                // Each tab is emitted only when the logged-in admin holds the
                // matching permission, so a section they cannot use never appears.
                // This is presentation only: the routes themselves are gated by
                // middleware, which is what actually enforces access.
                tabs: [
                    // The overview reports the whole server, so it is offered only to
                    // whoever may open it: an admin holding accessOverview, a reseller
                    // whose profile carries the allowOverview toggle. templatePerms
                    // resolves those two columns into this one slug, so the entry and
                    // the route can never disagree. Like the permission gates below
                    // this is the courtesy and not the control: the route itself
                    // refuses anyone else.
                    {{ if .perms.accessOverview }}
                    {
                        key: '{{ .base_path }}panel/',
                        icon: 'dashboard',
                        title: '{{ i18n "menu.dashboard"}}'
                    },
                    {{ end }}
                    {{ if .perms.accessInbounds }}
                    {
                        key: '{{ .base_path }}panel/inbounds',
                        icon: 'user',
                        title: '{{ i18n "menu.inbounds"}}'
                    },
                    {{ end }}
                    {{ if .perms.accessPanelSettings }}
                    {
                        key: '{{ .base_path }}panel/settings',
                        icon: 'setting',
                        title: '{{ i18n "menu.settings"}}'
                    },
                    {{ end }}
                    {{ if .perms.accessXraySettings }}
                    {
                        key: '{{ .base_path }}panel/xray',
                        icon: 'tool',
                        title: '{{ i18n "menu.xray"}}'
                    },
                    {{ end }}
                    {{ if .perms.accessCoreSettings }}
                    {
                        key: '{{ .base_path }}panel/core',
                        icon: 'cluster',
                        title: '{{ i18n "menu.core"}}'
                    },
                    {{ end }}
                    {{ if .perms.superAdmin }}
                    {
                        key: '{{ .base_path }}panel/admins',
                        icon: 'team',
                        title: '{{ i18n "menu.admins"}}'
                    },
                    {{ end }}
                    {{ if .perms.manageResellers }}
                    {
                        key: '{{ .base_path }}panel/resellers',
                        icon: 'shop',
                        title: '{{ i18n "menu.resellers"}}'
                    },
                    {{ end }}
                ],
                logout: {
                    key: '{{ .base_path }}logout/',
                    icon: 'logout',
                    title: '{{ i18n "menu.logout"}}'
                },
                requestUri: '{{ .request_uri }}',
                // Collapsed unless the operator has pinned it open. The stored
                // key is the historical "isSidebarCollapsed"; we invert it into
                // `pinned` so the default (absent) is icons-only, matching the
                // hover-to-peek rail. Absent a stored value we start narrow.
                pinned: localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === null
                    ? false
                    : JSON.parse(localStorage.getItem(SIDEBAR_COLLAPSED_KEY)) === false,
                // Theme popover portals outside the hit region. Without this
                // latch the CSS :hover would end the moment the pointer moved
                // onto the portal and the rail would slam shut under an open
                // menu. Keyboard focus-within covers focus; this covers click.
                overlayOpen: false,
                collapseLabel: '{{ i18n "menu.collapse"}}',
                expandLabel: '{{ i18n "menu.expand"}}',
                themeLabel: '{{ i18n "menu.theme"}}',
            }
        },
        methods: {
            onOverlayChange(open) {
                this.overlayOpen = !!open;
            },
            // The active tab used to be handed to ant's a-menu as selected-keys.
            // With plain anchors we compare against the request URI ourselves.
            // Trailing slashes vary between the emitted keys and the served URI,
            // so both sides are normalised before comparing.
            isActive(key) {
                const norm = (s) => (s || '').replace(/\/+$/, '');
                return norm(key) === norm(this.requestUri);
            },
            openLink(key) {
                return key.startsWith('http') ?
                    window.open(key) :
                    location.href = key
            },
            togglePin() {
                this.pinned = !this.pinned;
                // Persist the historical key so an older build reading the same
                // storage still understands the preference.
                localStorage.setItem(SIDEBAR_COLLAPSED_KEY, !this.pinned);
            },
        },
        template: `{{template "component/sidebar/content" .}}`,
    });
</script>
{{end}}
