# Build linux/amd64 Wild Panel and publish the release asset.
# Trigger: Actions → Release → Run workflow, or push a tag matching v*.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1)
        required: true
        default: v1
      make_latest:
        description: Mark this release as GitHub "latest"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build deps (cgo / sqlite)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc libc6-dev pkg-config

      - name: Cache VPN daemon bundle + Xray core embeds
        uses: actions/cache@v4
        with:
          path: |
            backend/bin
            corebundle/core
          key: embeds-amd64-${{ hashFiles('build/backend/**', 'build/core/**', '.gitmodules') }}
          restore-keys: |
            embeds-amd64-

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # go:embed config/version is baked in at compile time — must match the tag or
      # in-panel updates succeed but the UI still shows the old version (v2.0.5 bug).
      - name: Sync embedded version with tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          printf '%s\n' "$ver" > config/version
          echo "Embedded version -> ${ver}"
          cat config/version

      - name: Build Wild Panel
        env:
          # First run builds Docker daemon bundles (slow). Cache hits skip that.
          DOCKER_BUILDKIT: "1"
          RELEASE_VER: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x build.sh build/core/build.sh build/backend/build.sh || true
          ./build.sh
          test -x build/out/wild-panel-amd64
          ls -lh build/out/wild-panel-amd64
          # Sanity: ELF amd64
          file build/out/wild-panel-amd64 | tee /tmp/file-out.txt
          grep -qi 'ELF' /tmp/file-out.txt
          # Branding + API token UI must be embedded (catch stale/wrong binary)
          if ! strings build/out/wild-panel-amd64 | grep -q 'Wild Panel'; then
            echo "error: binary missing 'Wild Panel' branding" >&2
            exit 1
          fi
          if ! strings build/out/wild-panel-amd64 | grep -q 'apiTokens'; then
            echo "error: binary missing API tokens UI strings" >&2
            exit 1
          fi
          # Login copy (en_US) — keep in sync with translate.en_US.toml pages.login.title
          if ! strings build/out/wild-panel-amd64 | grep -q 'Sign in to Wild Panel'; then
            echo "error: binary missing login UI strings (Sign in to Wild Panel)" >&2
            exit 1
          fi
          # Login brand mark (holographic rings + wolf)
          if ! strings build/out/wild-panel-amd64 | grep -q 'lgt-holo'; then
            echo "error: binary missing login holographic brand markup" >&2
            exit 1
          fi
          if ! strings build/out/wild-panel-amd64 | grep -q 'wp-mark'; then
            echo "error: binary missing Wild Panel brand mark class" >&2
            exit 1
          fi
          # Design system tokens must ship in the embedded CSS
          if ! strings build/out/wild-panel-amd64 | grep -q 'brand-cyan'; then
            echo "error: binary missing brand design tokens" >&2
            exit 1
          fi
          ver="${RELEASE_VER#v}"
          if ! strings build/out/wild-panel-amd64 | grep -qF "$ver"; then
            echo "error: binary missing embedded version ${ver} (config/version out of sync with tag?)" >&2
            exit 1
          fi
          cp -f build/out/wild-panel-amd64 wild-panel-amd64
          # Compat name for older deploy/update fallbacks
          cp -f wild-panel-amd64 vpn-ui-amd64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          MAKE_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.make_latest || true }}
        run: |
          set -euo pipefail
          NOTES="$(printf '%s\n' \
            '## Wild Panel' \
            '' \
            '### v2.0.8' \
            '- International Egress Profile: route all inbounds through one outbound (blackout mode)' \
            '- Optional Iran-direct and public DNS override while profile is active' \
            '- Stronger dokodemo/SOCKS health checks (WG-C, AWG, GRE, MTProto, SSH)' \
            '- Egress outbound down detection in logs when profile is enabled' \
            '' \
            '### v2.0.7' \
            '- Full-width dashboard on desktop (content uses the whole viewport beside the rail)' \
            '- Modern sidebar: horizontal nav items, active accent bar, glass ambient, logout separated' \
            '- `deploy.sh`: Wild Panel branding only in all operator-facing messages; silent migration from previous installs' \
            '' \
            '### v2.0.6' \
            '- Fix in-panel update showing the wrong version (embedded `config/version` now synced to the release tag in CI)' \
            '' \
            '### v2.0.5' \
            '- Light theme refresh (cool mist ground, readable chrome, same cyan/violet brand DNA)' \
            '- Note: shipped with embedded version still 2.0.4 — update again from v2.0.6 onward to see the correct version' \
            '' \
            '### v2.0.4' \
            '- Flagship glass Design System across the whole panel (logo-first cyan/violet)' \
            '- Login holographic rings + wolf mark; glass cards/modals/buttons via ant-bridge' \
            '- Branded empty states, terminal theme, subscription page mark' \
            '- Release sanity checks synced to current UI markup' \
            '' \
            '### v2.0.3' \
            '- Fix real PNG logo (was mislabeled JPEG) + neon ring brand on login/sidebar' \
            '- Login/overview UI closer to mockups; release sanity checks synced to current copy' \
            '' \
            '### v2.0.2' \
            '- Logo display fix (circular contain) + aurora/orbital login motion' \
            '- Scrub user-facing VPN-UI branding → Wild Panel only' \
            '- Personalized README with UI screenshots' \
            '- Stronger responsive layout (phone → desktop)' \
            '' \
            '### v2.0.1' \
            '- Glass / neon UI theme (cyan + purple) aligned with the wolf logo' \
            '- Redesigned login welcome screen with logo and motion' \
            '- Overview tiles: glassmorphism + entrance animations' \
            '- `deploy.sh` auto-installs curl/wget and other prerequisites' \
            '' \
            '### Core' \
            '- Branding: Wild Panel' \
            '- API Bearer tokens (Settings → Security) for sales bots / mirzabot' \
            '- Install paths: `/opt/wild-panel`, unit `wild-panel`, menu `wild-panel`' \
            '' \
            'Asset: `wild-panel-amd64` (also uploaded as `vpn-ui-amd64` for legacy fallback).')"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" wild-panel-amd64 vpn-ui-amd64 --clobber
            if [[ "$MAKE_LATEST" == "true" ]]; then
              gh release edit "$TAG" --latest
            fi
          else
            EXTRA=()
            if [[ "$MAKE_LATEST" == "true" ]]; then
              EXTRA+=(--latest)
            fi
            gh release create "$TAG" wild-panel-amd64 vpn-ui-amd64 \
              --title "Wild Panel ${TAG}" \
              --notes "$NOTES" \
              "${EXTRA[@]}"
          fi
          # Note: gh release view JSON schema has no "isLatest" field on all CLI
          # versions — use name/url/assets only so publish is not marked failed
          # after a successful upload.
          gh release view "$TAG" --json tagName,name,url,assets \
            --jq '{tag:.tagName, name:.name, url:.url, assets:[.assets[].name]}'
          echo "Published $TAG successfully."
